name: Build and Forge GameTest 1.0.44
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build installable mod
        run: bash gradlew --no-daemon clean build
      - name: Run actual Forge GameTest server
        run: bash gradlew --no-daemon runGameTestServer
      - name: Upload mod and GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residencias-dos-aldeoes-1.0.44
          path: |
            build/libs/*.jar
            run-gametest/logs/
            run-gametest/*.xml
          if-no-files-found: warn
