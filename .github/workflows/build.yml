name: Build Forge mod

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify skin preview and modal input invariants
        run: python tools/verify_skin_preview_ui.py
      - name: Verify anchor visuals and resident return invariants
        run: python tools/verify_anchor_residence.py
      - name: Verify food indicators, output slots, and emerald fragment
        run: python tools/verify_residence_food_slots_item.py
      - name: Verify daily emerald fragment production
        run: python tools/verify_daily_production.py
      - name: Verify reinforced door registration, recipe, and assets
        run: python tools/verify_reinforced_door.py
      - name: Build with the project Gradle wrapper
        run: ./gradlew --no-daemon clean build
      - name: Verify mod resources and Mixin packaging
        run: |
          python - <<'PY'
          from email import policy
          from email.parser import BytesParser
          from zipfile import ZipFile

          jar_path = "build/libs/residencias-dos-aldeoes-1.0.40.jar"
          with ZipFile(jar_path) as jar:
              entries = set(jar.namelist())
              manifest = BytesParser(policy=policy.default).parsebytes(
                  jar.read("META-INF/MANIFEST.MF")
              )
              required = {
                  "br/com/residenciasaldeoes/mixin/VillagerRendererMixin.class",
                  "br/com/residenciasaldeoes/client/FreshAnimationsFaceTextureAdapter.class",
                  "br/com/residenciasaldeoes/menu/AnchorMenu.class",
                  "br/com/residenciasaldeoes/block/ResidentialAnchorBlockEntity.class",
                  "br/com/residenciasaldeoes/VillagerResidenceEvents.class",
                  "br/com/residenciasaldeoes/data/ResidenceData.class",
                  "br/com/residenciasaldeoes/block/ReinforcedDoorBlock.class",
                  "residencias.mixins.json",
                  "residencias.refmap.json",
                  "META-INF/mods.toml",
                  "assets/residenciasaldeoes/models/item/emerald_fragment.json",
                  "assets/residenciasaldeoes/textures/item/emerald_fragment.png",
                  "data/residenciasaldeoes/recipes/emerald_from_fragment.json",
                  "data/residenciasaldeoes/recipes/reinforced_door.json",
                  "data/residenciasaldeoes/tags/items/vanilla_doors.json",
                  "data/minecraft/tags/blocks/wooden_doors.json",
                  "data/residenciasaldeoes/loot_tables/blocks/reinforced_door.json",
                  "assets/residenciasaldeoes/blockstates/reinforced_door.json",
                  "assets/residenciasaldeoes/models/block/reinforced_door_bottom.json",
                  "assets/residenciasaldeoes/models/block/reinforced_door_top.json",
                  "assets/residenciasaldeoes/models/item/reinforced_door.json",
                  "assets/residenciasaldeoes/textures/block/reinforced_door_lower.png",
                  "assets/residenciasaldeoes/textures/block/reinforced_door_upper.png",
                  "assets/residenciasaldeoes/textures/item/reinforced_door.png",
              }
              missing = required - entries
              if missing:
                  raise SystemExit(f"Missing required JAR entries: {sorted(missing)}")
              if jar.read("assets/residenciasaldeoes/textures/item/emerald_fragment.png")[:8] != bytes.fromhex("89504e470d0a1a0a"):
                  raise SystemExit("Emerald fragment texture is not a PNG")
              if manifest.get("MixinConfigs") != "residencias.mixins.json":
                  raise SystemExit(
                      f"MixinConfigs manifest entry is {manifest.get('MixinConfigs')!r}"
                  )
              mods = jar.read("META-INF/mods.toml").decode("utf-8")
              if 'version="1.0.40"' not in mods:
                  raise SystemExit("JAR does not identify itself as mod version 1.0.40")
              blockstates = __import__("json").loads(jar.read("assets/residenciasaldeoes/blockstates/reinforced_door.json"))
              if len(blockstates.get("variants", {})) != 64:
                  raise SystemExit("Reinforced door does not define all 64 vanilla block states")
              for path in ("assets/residenciasaldeoes/textures/block/reinforced_door_lower.png", "assets/residenciasaldeoes/textures/block/reinforced_door_upper.png", "assets/residenciasaldeoes/textures/item/reinforced_door.png"):
                  if jar.read(path)[:8] != bytes.fromhex("89504e470d0a1a0a"):
                      raise SystemExit(f"{path} is not a PNG")
          print("JAR packaging check passed: version 1.0.40, Mixin, emerald production, reinforced door, and UI resources")
          PY
      - name: Package complete source archive
        run: git archive --format=zip --output=build/residencias-dos-aldeoes-1.0.40-source.zip HEAD
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: residencias-dos-aldeoes-1.0.40
          path: build/libs/residencias-dos-aldeoes-1.0.40.jar
          if-no-files-found: error
      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: residencias-dos-aldeoes-1.0.40-source
          path: build/residencias-dos-aldeoes-1.0.40-source.zip
          if-no-files-found: error
