name: Build Forge mod

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build with the project Gradle wrapper
        run: ./gradlew --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: residencias-dos-aldeoes-1.0.17
          path: build/libs/residencias-dos-aldeoes-1.0.17.jar
          if-no-files-found: error
