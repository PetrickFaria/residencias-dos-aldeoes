name: Build and Forge GameTest
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enforce sequential release versioning
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid mod_version: $current" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$PR_BASE_SHA"
            base="$(git show "$PR_BASE_SHA:gradle.properties" | sed -n 's/^mod_version=//p')"
            if [[ "$current" != "$base" ]]; then
              echo "PRs and test builds must not consume release numbers ($base -> $current)." >&2
              exit 1
            fi
            exit 0
          fi

          previous="$(git show 'HEAD^:gradle.properties' | sed -n 's/^mod_version=//p')"
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^chore\(release\):[[:space:]]prepare[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            prepared="${BASH_REMATCH[1]}"
            if [[ "$previous" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              expected="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "Invalid previous mod_version: $previous" >&2
              exit 1
            fi
            if [[ "$current" != "$prepared" || "$current" != "$expected" ]]; then
              echo "Release commits must advance exactly one patch version ($previous -> $expected)." >&2
              exit 1
            fi
          elif [[ "$current" != "$previous" ]]; then
            echo "Only the release workflow may change mod_version ($previous -> $current)." >&2
            exit 1
          fi
      - name: Read project version
        id: version
        run: echo "value=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Verify output and preserved behavior
        run: |
          python3 tools/verify_daily_production.py
          python3 tools/verify_residence_food_slots_item.py
          python3 tools/verify_reinforced_door.py
          python3 tools/verify_emerald_chest.py
          python3 tools/verify_fragment_drops.py
          python3 tools/verify_approved_geometry.py
          python3 tools/verify_texture_finish.py
          python3 tools/verify_resident_spawn_exclusions.py
          python3 tools/verify_emerald_fragment_texture.py
          python3 tools/verify_capture_identity.py
          python3 tools/verify_skin_preview_ui.py
          python3 tools/verify_skin_opacity_uv_and_night_doors.py
      - name: Build installable mod
        timeout-minutes: 15
        run: bash gradlew --no-daemon clean build
      - name: Run actual Forge GameTest server
        timeout-minutes: 12
        run: python3 tools/run_gametest_ci.py
      - name: Launch graphical Forge client and reopen world
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python3 tools/run_visual_ci.py
      - name: Prepare compiled JAR, complete source and report
        if: success()
        run: python3 tools/prepare_delivery.py
      - name: Upload mod and GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residencias-dos-aldeoes-${{ steps.version.outputs.value }}
          path: |
            build/libs/*.jar
            gametest-console.log
            run-gametest/logs/
            run-gametest/*.xml
            build/screenshots/
            client-console.log
            client-restore-console.log
            artifact-output/
          if-no-files-found: warn
