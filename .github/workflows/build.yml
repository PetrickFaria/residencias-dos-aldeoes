name: Build and Forge GameTest 1.0.47
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify output and preserved behavior
        run: |
          python3 tools/verify_daily_production.py
          python3 tools/verify_residence_food_slots_item.py
          python3 tools/verify_reinforced_door.py
          python3 tools/verify_emerald_chest.py
          python3 tools/verify_fragment_drops.py
          python3 tools/verify_approved_geometry.py
          python3 tools/verify_texture_finish.py
      - name: Build installable mod
        timeout-minutes: 15
        run: bash gradlew --no-daemon clean build
      - name: Run actual Forge GameTest server
        timeout-minutes: 12
        run: python3 tools/run_gametest_ci.py
      - name: Attempt graphical development client
        if: always()
        timeout-minutes: 8
        continue-on-error: true
        run: python3 tools/run_visual_ci.py
      - name: Prepare compiled JAR, complete source and report
        if: always()
        run: python3 tools/prepare_delivery.py
      - name: Upload mod and GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residencias-dos-aldeoes-1.0.47
          path: |
            build/libs/*.jar
            gametest-console.log
            run-gametest/logs/
            run-gametest/*.xml
            build/screenshots/
            client-console.log
            artifact-output/
          if-no-files-found: warn
