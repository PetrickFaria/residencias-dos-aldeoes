name: Build and Forge GameTest 1.0.44
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build installable mod
        run: bash gradlew --no-daemon clean build
      - name: Run actual Forge GameTest server
        timeout-minutes: 8
        run: python3 tools/run_gametest_ci.py
      - name: Attempt graphical development client
        timeout-minutes: 8
        continue-on-error: true
        run: |
          if ! command -v xvfb-run; then exit 2; fi
          mkdir -p run/saves
          cp -a run-gametest/world run/saves/visual-check
          xvfb-run -a -s "-screen 0 1920x1080x24" bash gradlew --no-daemon -Pvisual_check=true runClient > client-console.log 2>&1
      - name: Upload mod and GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residencias-dos-aldeoes-1.0.44
          path: |
            build/libs/*.jar
            gametest-console.log
            run-gametest/logs/
            run-gametest/*.xml
            build/screenshots/
            client-console.log
          if-no-files-found: warn
